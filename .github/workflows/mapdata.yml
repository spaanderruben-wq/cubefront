name: mapdata
# Downloads the open map data Cubefront is built from (OpenStreetMap via Geofabrik, AHN heights via PDOK,
# terrain tiles) and commits it to data/. Run it from the Actions tab or by changing tools/fetch_map.py.
on:
  workflow_dispatch:
  push:
    paths: ['tools/fetch_map.py', '.github/workflows/mapdata.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -y && sudo apt-get install -y osmium-tool
      - run: pip install numpy tifffile imagecodecs pyproj shapely pillow
      - run: python tools/fetch_map.py
      - name: commit data
        run: |
          git config user.name "cubefront-mapdata"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "map data (OpenStreetMap, AHN)" || echo "nothing new"
          git pull --rebase || true
          git push
